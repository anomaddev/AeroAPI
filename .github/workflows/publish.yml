name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish aeroapi
        run: npm publish -w aeroapi --provenance --access public
        env:
          # Only used if trusted publishing isn't configured yet (first publish).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
